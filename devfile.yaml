schemaVersion: 2.2.0
metadata:
  name: udi-gen-app
components:
  - container:
      image: quay.io/devfile/universal-developer-image:ubi10-latest
      memoryLimit: 16G
      memoryRequest: 8G
      endpoints:
        - name: http-3000
          targetPort: 3000
    name: runtime
commands:
  - id: install
    exec:
      commandLine: npm install
      component: runtime
      workingDir: ${PROJECT_SOURCE}
      group:
        isDefault: true
        kind: build
  - id: run
    exec:
      commandLine: node app.js
      component: runtime
      workingDir: ${PROJECT_SOURCE}
      group:
        isDefault: true
        kind: run
  - id: install-aws-cli
    exec:
      commandLine: 'pip install awscli --upgrade'
      component: runtime
  - id: deploy-on-gke
    exec:
      commandLine: kubectl --kubeconfig kube-files/gkubec -n ude-demo-app apply -f kube-files/ude-demoapp-deploy.yaml
      component: runtime
      workingDir: ${PROJECT_SOURCE}
      group:
        isDefault: false
        kind: run
